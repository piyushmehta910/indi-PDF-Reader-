name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: |
            a5e75118d96b4eac2100876f6af6a5ca5029cd440f87736425350fb4cf308b42
            b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Error: gradle/wrapper/gradle-wrapper.jar does not exist!"
            exit 1
          fi
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Error: gradle/wrapper/gradle-wrapper.jar is empty!"
            exit 1
          fi
          # Verify that the jar can be read and is not corrupted
          jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null || {
            echo "Error: gradle/wrapper/gradle-wrapper.jar is invalid or corrupted!"
            exit 1
          }
          echo "Gradle Wrapper JAR is valid."

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
